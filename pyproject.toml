[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sekai-card-id"
version = "0.1.0"
description = "Card gallery builder and zero-training retrieval baseline for recognizing Project SEKAI cards in screenshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Pretrained embedding backends (DINOv2 / CLIP / any timm model).
# Install torch first from the index that matches your hardware, e.g.
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
ml = [
  "torch>=2.1",
  "timm>=1.0",
]
# Serving with an exported model: no torch needed.
onnx = [
  "onnxruntime>=1.17",
]
# Writing that model (`sekai-card-id export-onnx`). Install torch/torchvision first as above.
export = [
  "torch>=2.5",
  "timm>=1.0",
  "onnx>=1.16",
  "onnxscript>=0.1",
  "onnxruntime>=1.17",
]
dev = [
  "pytest>=8",
  "onnx>=1.16",
  "onnxruntime>=1.17",
]

[project.scripts]
sekai-card-id = "sekai_card_id.cli:main"

[tool.setuptools]
packages = ["sekai_card_id"]

[tool.setuptools.package-data]
sekai_card_id = ["layouts/*.json", "layouts/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# tests/ holds conftest.py, imported directly by the tests
src = [".", "tests"]
